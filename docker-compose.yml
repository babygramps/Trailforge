services:
  trailforge-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - web_dist:/srv/web:ro
    depends_on:
      trailforge-api:
        condition: service_healthy
      trailforge-web:
        condition: service_completed_successfully
    networks:
      - trailforge

  trailforge-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    volumes:
      - web_dist:/app/dist
    networks:
      - trailforge

  trailforge-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - API_PORT=${API_PORT:-8080}
      - FITBIT_CLIENT_ID=${FITBIT_CLIENT_ID:-}
      - FITBIT_CLIENT_SECRET=${FITBIT_CLIENT_SECRET:-}
      - SATELLITE_PROVIDER=${SATELLITE_PROVIDER:-}
      - SATELLITE_API_KEY=${SATELLITE_API_KEY:-}
      - VALHALLA_URL=${VALHALLA_URL:-}
      - TILE_SERVER_URL=http://trailforge-tiles:8081
    depends_on:
      trailforge-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - trailforge

  trailforge-db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-trailforge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-trailforge}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trailforge}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trailforge

  trailforge-tiles:
    image: maptiler/tileserver-gl:latest
    restart: unless-stopped
    volumes:
      - ./tiles/config.json:/app/config.json:ro
      - ./tiles/styles:/app/styles:ro
      - ./tiles/data:/app/data:ro
    networks:
      - trailforge

  trailforge-valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    restart: unless-stopped
    profiles:
      - routing
    volumes:
      - ./valhalla/custom_files:/custom_files
    environment:
      - tile_urls=https://download.geofabrik.de/north-america/us/california-latest.osm.pbf
      - serve_tiles=True
      - build_elevation=True
      - build_admins=True
      - build_time_zones=True
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - trailforge

volumes:
  caddy_data:
  caddy_config:
  web_dist:
  db_data:

networks:
  trailforge:
    driver: bridge
