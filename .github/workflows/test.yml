name: TrailForge Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-unit-tests:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: api/go.sum
      - run: go test ./... -v -count=1 -run "^TestUnit" -coverprofile=coverage-unit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: go-unit-coverage
          path: api/coverage-unit.txt

  go-integration-tests:
    name: Go Integration Tests (PostGIS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: api/go.sum
      - run: go test ./internal/repository/... -v -count=1 -run "^TestInteg" -tags integration -timeout 300s

  go-api-ws-tests:
    name: Go API + WebSocket Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: api/go.sum
      - run: go test ./internal/handler/... -v -count=1 -race -coverprofile=coverage-api.txt
      - uses: actions/upload-artifact@v4
        with:
          name: go-api-coverage
          path: api/coverage-api.txt

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run --coverage --reporter=verbose
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: web/coverage/

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [go-unit-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start services
        run: |
          cp .env.example .env
          sed -i 's/changeme/testpass/g' .env
          echo "JWT_SECRET=test-secret-for-ci" >> .env
          docker compose up -d --build
          # Wait for API to be healthy
          for i in $(seq 1 30); do
            if curl -sf http://localhost:80/api/health > /dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 5
          done

      - name: Install Playwright
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./e2e
        run: npx playwright test --project=chromium
        env:
          E2E_BASE_URL: http://localhost:80

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Stop services
        if: always()
        run: docker compose down -v
